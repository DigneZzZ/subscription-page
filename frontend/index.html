<!doctype html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="UTF-8" />
        <meta name="robots" content="noindex, nofollow" />
        <!-- Server-rendered from the resolved THEME_PRESET (backend
             THEME_BACKGROUNDS map, kept in sync with the frontend theme
             presets) so first paint matches the theme with no dark flash on the
             light preset. applyPresetCssVars() re-applies these at runtime. -->
        <meta name="color-scheme" content="<%- uiColorScheme %>" />
        <meta name="theme-color" content="<%- uiThemeColor %>" />
        <style>
            html,
            body {
                background-color: <%- uiThemeColor %>;
            }
        </style>
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1"
        />
        <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
        <link rel="icon" sizes="32x32" type="image/png" href="/assets/favicon-32x32.png" />
        <link rel="icon" sizes="16x16" type="image/png" href="/assets/favicon-16x16.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon-180x180.png" />

        <link rel="preconnect" crossorigin="anonymous" href="https://fonts.googleapis.com" />
        <link rel="preconnect" crossorigin="anonymous" href="https://fonts.gstatic.com" />

        <link
            href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Unbounded:wght@300;400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@100..900&display=swap"
            rel="stylesheet"
        />

        <meta name="description" content="<%- metaDescription %>" />
        <title><%- metaTitle %></title>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="./src/main.tsx"></script>

        <div id="sbpg" data-panel="<%- panelData %>"></div>
        <div id="pmt" data-url="<%- paymentUrl %>" data-tariffs="<%- paymentTariffs %>" data-reset="<%- paymentReset %>"></div>
        <div id="sup" data-email="<%- supportEmail %>"></div>
        <div id="hwid" data-hwid="<%- hwidData %>"></div>
        <div id="ui" data-preset="<%- uiPreset %>"></div>

        <!-- Chatwoot live chat widget. The template values are injected by the
             backend at request time (see backend/src/modules/root/chatwoot.ts);
             an EJS `if` here would run at vite build time, so the guard is
             runtime JS. Language and color scheme are kept in sync from React
             (shared/hooks/use-chatwoot-sync). -->
        <script>
          (function (d, w) {
            var BASE = "<%- chatwootBaseUrl %>";
            var TOKEN = "<%- chatwootWebsiteToken %>";
            var IDENTIFIER_HASH = "<%- chatwootIdentifierHash %>";
            var SETTINGS = "<%- chatwootSettings %>";
            if (!TOKEN) return;

            var settings = {};
            try {
              if (SETTINGS) settings = JSON.parse(atob(SETTINGS));
            } catch (e) {}
            // CHATWOOT_PROXY=1: the backend relays the widget, so everything is
            // loaded from this page's own origin and the upstream host stays hidden.
            if (settings.proxied) BASE = w.location.origin;
            if (!BASE) return;

            var user = null;
            try {
              var el = d.getElementById("sbpg");
              var panel = el && el.dataset.panel ? JSON.parse(atob(el.dataset.panel)) : null;
              user = (panel && panel.response && panel.response.user) || null;
            } catch (e) {}
            // Same key i18next-browser-languagedetector caches the page language under.
            var lang = "";
            try {
              lang = w.localStorage.getItem("i18nextLng") || "";
            } catch (e) {}
            if (!lang && w.navigator && w.navigator.language) lang = w.navigator.language;
            lang = String(lang).split("-")[0].toLowerCase();
            if (lang) settings.locale = lang;
            w.chatwootSettings = settings;

            w.addEventListener("chatwoot:ready", function () {
              if (!w.$chatwoot || !user || !user.shortUuid) return;
              try {
                var payload = {
                  name: user.username || user.shortUuid,
                  custom_attributes: {
                    short_uuid: user.shortUuid,
                    username: user.username || "",
                    status: user.userStatus || "",
                    expires_at: user.expiresAt || "",
                    traffic_used: user.trafficUsed || "",
                    traffic_limit: user.trafficLimit || "",
                    days_left: user.daysLeft != null ? String(user.daysLeft) : ""
                  }
                };
                if (IDENTIFIER_HASH) payload.identifier_hash = IDENTIFIER_HASH;
                w.$chatwoot.setUser(user.shortUuid, payload);
                w.$chatwoot.setCustomAttributes({ source: "subscription_page" });
              } catch (e) {
                console.warn("Chatwoot setUser failed:", e);
              }
            });
            w.addEventListener("chatwoot:error", function (e) {
              console.warn("Chatwoot widget error:", e && e.detail);
            });

            var g = d.createElement("script");
            var s = d.getElementsByTagName("script")[0];
            g.src = BASE + "/packs/js/sdk.js";
            g.defer = true;
            g.async = true;
            g.onload = function () {
              if (w.chatwootSDK) w.chatwootSDK.run({ websiteToken: TOKEN, baseUrl: BASE });
            };
            g.onerror = function () {
              console.warn("Chatwoot SDK failed to load from " + BASE);
            };
            s.parentNode.insertBefore(g, s);
          })(document, window);
        </script>
    </body>
</html>
